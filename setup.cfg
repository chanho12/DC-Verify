[metadata]
name = dc-verify
version = 0.2.0
description = Document-grounded evidence verification experiment, packaged by stage
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    openai>=2.48,<3
    python-dotenv>=1.2,<2
    pydantic>=2.13,<3
    PyMuPDF>=1.26,<2
    beautifulsoup4>=4.15,<5
    certifi>=2025.11.12
    langgraph>=0.6.11,<0.7
    langchain-core>=0.3.86,<0.4
    langgraph-checkpoint-sqlite>=2.0.11,<3
    qdrant-client>=1.15.1,<1.16
    tzdata>=2025.2; platform_system == "Windows"

[options.packages.find]
where = src

[options.package_data]
dc_verify = *.json
dc_verify.step.step10.code = *.html, *.css, *.js

[options.entry_points]
console_scripts =
    dc-verify = dc_verify.cli:main
